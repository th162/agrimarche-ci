<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b5e3a">
<title>AgriMarché CI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--vert:#1b5e3a;--vert2:#144a2d;--or:#e0a526;--fond:#f6f7f2;--carte:#fff;--texte:#1d2a22;--gris:#5d6b62;--ligne:#d8ddd3;--rouge:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);line-height:1.5}
header{background:var(--vert);color:#fff;padding:28px 20px 22px;border-bottom:6px solid var(--or)}
header h1{margin:0;font-size:1.7rem;letter-spacing:-.01em}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
main{max-width:460px;margin:0 auto;padding:18px 16px 60px}
.onglets{display:flex;gap:8px;margin-bottom:16px}
.onglets button{flex:1;padding:12px;border:2px solid var(--vert);background:transparent;color:var(--vert);font-size:1rem;font-weight:600;border-radius:10px}
.onglets button.actif{background:var(--vert);color:#fff}
form,.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:12px;font-size:1rem;border:1px solid var(--ligne);border-radius:8px;background:#fff;color:var(--texte)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--or);outline-offset:1px}
.aide{font-size:.8rem;color:var(--gris);margin:3px 0 0}
.principal{width:100%;margin-top:18px;padding:14px;font-size:1.05rem;font-weight:700;border:0;border-radius:10px;background:var(--vert);color:#fff}
.principal:disabled{opacity:.6}
.secondaire{width:100%;margin-top:12px;padding:12px;font-size:1rem;border:2px solid var(--vert);border-radius:10px;background:transparent;color:var(--vert);font-weight:600}
#msg{margin:14px 0 0;padding:12px;border-radius:8px;font-size:.92rem;display:none}
#msg.err{display:block;background:#fdecea;color:var(--rouge)}
#msg.ok{display:block;background:#e6f4ea;color:var(--vert2)}
.cache{display:none}
.badge{display:inline-block;background:var(--or);color:#2b2100;font-weight:700;border-radius:20px;padding:2px 12px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>AgriMarché CI</h1>
  <p>Producteurs, acheteurs et transporteurs de Côte d’Ivoire</p>
</header>
<main>

  <section id="vue-auth">
    <div class="onglets">
      <button id="t-connexion" class="actif" type="button">Connexion</button>
      <button id="t-inscription" type="button">Inscription</button>
    </div>

    <form id="f-connexion">
      <label for="c-email">Email</label>
      <input id="c-email" type="email" autocomplete="email" required>
      <label for="c-mdp">Mot de passe</label>
      <input id="c-mdp" type="password" autocomplete="current-password" required>
      <button class="principal" type="submit">Se connecter</button>
    </form>

    <form id="f-inscription" class="cache">
      <label for="i-role">Je suis</label>
      <select id="i-role" required>
        <option value="">Choisir…</option>
        <option value="producteur">Producteur (je vends)</option>
        <option value="acheteur">Acheteur (j’achète)</option>
        <option value="transporteur">Transporteur</option>
      </select>
      <label for="i-nom">Nom complet</label>
      <input id="i-nom" type="text" autocomplete="name" required>
      <label for="i-ville">Ville</label>
      <input id="i-ville" type="text" placeholder="Ex. : Bouaké" required>
      <label for="i-tel">Téléphone</label>
      <input id="i-tel" type="tel" inputmode="tel" placeholder="Ex. : 0707070707" required>
      <label for="i-wa">WhatsApp (si différent)</label>
      <input id="i-wa" type="tel" inputmode="tel">
      <p class="aide">Ton numéro sera visible uniquement par les membres connectés.</p>
      <label for="i-email">Email</label>
      <input id="i-email" type="email" autocomplete="email" required>
      <label for="i-mdp">Mot de passe</label>
      <input id="i-mdp" type="password" autocomplete="new-password" minlength="6" required>
      <p class="aide">6 caractères minimum.</p>
      <button class="principal" type="submit">Créer mon compte</button>
    </form>
  </section>

  <section id="vue-accueil" class="cache">
    <div class="carte">
      <h2 id="bienvenue" style="margin-top:0"></h2>
      <p><span class="badge" id="role-badge"></span> <span id="ville-txt"></span></p>
      <p>Ton compte fonctionne. Les annonces arrivent à l’étape suivante.</p>
      <button class="secondaire" id="deconnexion" type="button">Se déconnecter</button>
    </div>
  </section>

  <div id="msg" role="status"></div>
</main>

<script>
const SUPABASE_URL = "https://mpsilkybsecptoldnnqq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ajos2QN3FYr6eo0S3E7hAw_i7X6TN6p";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const msg = (texte, type) => { const m = $("msg"); m.textContent = texte; m.className = type || ""; };
const traduire = e => {
  const t = (e && e.message || "").toLowerCase();
  if (t.includes("invalid login")) return "Email ou mot de passe incorrect.";
  if (t.includes("already registered")) return "Cet email a déjà un compte. Utilise l’onglet Connexion.";
  if (t.includes("email not confirmed")) return "Confirme d’abord ton email (lien reçu dans ta boîte mail).";
  if (t.includes("password")) return "Mot de passe trop court (6 caractères minimum).";
  if (t.includes("rate limit")) return "Trop d’essais. Attends quelques minutes.";
  if (t.includes("fetch")) return "Pas de connexion internet. Réessaie.";
  return "Erreur : " + (e && e.message ? e.message : "inconnue");
};

function onglet(nom){
  const co = nom === "connexion";
  $("f-connexion").classList.toggle("cache", !co);
  $("f-inscription").classList.toggle("cache", co);
  $("t-connexion").classList.toggle("actif", co);
  $("t-inscription").classList.toggle("actif", !co);
  msg("");
}
$("t-connexion").onclick = () => onglet("connexion");
$("t-inscription").onclick = () => onglet("inscription");

// Crée la fiche profil si elle n'existe pas encore
async function assurerProfil(user){
  const { data } = await db.from("profils").select("*").eq("id", user.id).maybeSingle();
  if (data) return data;
  const m = user.user_metadata || {};
  if (!m.role || !m.nom) return null;
  const { data: cree, error } = await db.from("profils").insert({
    id: user.id, nom: m.nom, role: m.role,
    telephone: m.telephone || null, whatsapp: m.whatsapp || m.telephone || null, ville: m.ville || null
  }).select().single();
  if (error) throw error;
  return cree;
}

async function afficherAccueil(user){
  try{
    const p = await assurerProfil(user);
    if (!p) { msg("Profil introuvable. Déconnecte-toi et recrée ton compte.", "err"); }
    $("bienvenue").textContent = "Bienvenue " + (p ? p.nom : "");
    $("role-badge").textContent = p ? p.role : "";
    $("ville-txt").textContent = p && p.ville ? p.ville : "";
    $("vue-auth").classList.add("cache");
    $("vue-accueil").classList.remove("cache");
  }catch(e){ msg(traduire(e), "err"); }
}

$("f-inscription").onsubmit = async ev => {
  ev.preventDefault();
  const b = ev.submitter; b.disabled = true; msg("");
  const tel = $("i-tel").value.trim();
  const { data, error } = await db.auth.signUp({
    email: $("i-email").value.trim(),
    password: $("i-mdp").value,
    options: { data: {
      nom: $("i-nom").value.trim(), role: $("i-role").value, ville: $("i-ville").value.trim(),
      telephone: tel, whatsapp: $("i-wa").value.trim() || tel
    }}
  });
  b.disabled = false;
  if (error) return msg(traduire(error), "err");
  if (data.session) { msg("Compte créé !", "ok"); afficherAccueil(data.user); }
  else { msg("Compte créé. Confirme ton email (lien reçu), puis connecte-toi.", "ok"); onglet("connexion"); }
};

$("f-connexion").onsubmit = async ev => {
  ev.preventDefault();
  const b = ev.submitter; b.disabled = true; msg("");
  const { data, error } = await db.auth.signInWithPassword({
    email: $("c-email").value.trim(), password: $("c-mdp").value
  });
  b.disabled = false;
  if (error) return msg(traduire(error), "err");
  afficherAccueil(data.user);
};

$("deconnexion").onclick = async () => {
  await db.auth.signOut();
  $("vue-accueil").classList.add("cache");
  $("vue-auth").classList.remove("cache");
  onglet("connexion");
};

db.auth.getSession().then(({ data }) => { if (data.session) afficherAccueil(data.session.user); });
</script>
</body>
  </html>
